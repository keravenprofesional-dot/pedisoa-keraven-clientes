# Supabase (plan gratis) pausa la base de datos tras 7 días sin uso y manda
# correos de aviso. Esta tarea la usa una vez al día para que nunca se pause.
# Usa las mismas variables SUPABASE_URL y SUPABASE_ANON_KEY del repositorio.
name: Mantener Supabase activa
on:
  schedule:
    - cron: '17 11 * * *'   # todos los días, 7:17 a. m. hora de RD
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ vars.SUPABASE_URL }}/rest/v1/pedidos_permisos?select=clave&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}")
          echo "Supabase respondió: $code"
          test "$code" = "200"
      # GitHub apaga las tareas programadas si el repositorio pasa 60 días sin
      # cambios. Reactivarla aquí mismo reinicia ese contador cada día.
      - name: Evitar que GitHub apague esta tarea
        run: |
          curl -s -X PUT -o /dev/null -w 'reactivada: %{http_code}\n' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/mantener-activa.yml/enable"
