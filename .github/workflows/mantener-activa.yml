# Supabase (plan gratis) pausa la base de datos tras 7 días sin uso y manda
# correos de aviso. Esta tarea la usa una vez al día para que nunca se pause.
# Usa las mismas variables SUPABASE_URL y SUPABASE_ANON_KEY del repositorio.
name: Mantener Supabase activa
on:
  schedule:
    - cron: '17 11 * * *'   # todos los días, 7:17 a. m. hora de RD
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ vars.SUPABASE_URL }}/rest/v1/pedidos_permisos?select=clave&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}")
          echo "Supabase respondió: $code"
          test "$code" = "200"
